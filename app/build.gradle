plugins {
    alias(libs.plugins.android.application)
}

android {
    namespace = 'com.rubyfpv.viewer'
    compileSdk = 35

    defaultConfig {
        applicationId "com.rubyfpv.viewer"
        minSdk 24
        targetSdk 35
        versionCode 8
        versionName "1.6"
    }

    buildFeatures {
        buildConfig = true
    }

    buildTypes {
        release {
            minifyEnabled = true
            shrinkResources = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    // Stamp the version into the APK filename, e.g. RubyFPV-v1.2-b3-debug.apk
    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            outputFileName = "RubyFPV-v${variant.versionName}-b${variant.versionCode}-${variant.buildType.name}.apk"
        }
    }
}

dependencies {
    implementation libs.material
    implementation libs.constraintlayout
    implementation libs.swiperefreshlayout
    implementation libs.jsch
    implementation libs.media3.exoplayer
    implementation libs.media3.ui
    implementation libs.media3.transformer
}
